<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efe6d2" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%23efe6d2'/><path d='M12 3 21 12 12 21 3 12Z' fill='none' stroke='%232a2633' stroke-width='1.6'/><circle cx='12' cy='12' r='3' fill='none' stroke='%232f7f7a' stroke-width='1.6'/><path d='M12 3v6M12 15v6' stroke='%232a2633' stroke-width='1.6'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
    />
    <title>Omnidle</title>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash light.
      try {
        var t = JSON.parse(localStorage.getItem('omnidle-progress') || '{}').state;
        if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme;
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
